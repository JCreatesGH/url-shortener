<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="system-ui,Segoe UI,Helvetica,sans-serif">
  <rect width="820" height="500" fill="#0f1117"/>
  <g transform="translate(40,30)">
    <text x="0" y="24" font-size="24" font-weight="800" fill="#e6edf3">Shortly</text>
    <text x="0" y="46" font-size="13" fill="#9aa4b2">Shorten a URL and track every click.</text>
    <!-- form -->
    <rect x="0" y="60" width="600" height="44" rx="9" fill="#0b0d12" stroke="#30363d"/>
    <text x="14" y="88" font-size="13" fill="#6e7681">https://example.com/very/long/marketing/link</text>
    <rect x="612" y="60" width="124" height="44" rx="9" fill="#6366f1"/><text x="674" y="88" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">Shorten</text>
    <!-- result -->
    <rect x="0" y="118" width="736" height="42" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="14" y="144" font-size="13" fill="#e6edf3">Short link:  <tspan fill="#6366f1" font-family="monospace">http://sho.rt/g8Qa</tspan></text>
    <!-- links list -->
    <rect x="0" y="176" width="360" height="290" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="16" y="202" font-size="14" font-weight="700" fill="#e6edf3">Your links</text>
    <g font-size="12.5">
      <text x="16" y="232" fill="#6366f1" font-family="monospace">/g8Qa</text><text x="70" y="232" fill="#c9d1d9">→ example.com/launch</text><rect x="280" y="220" width="64" height="18" rx="9" fill="#21262d"/><text x="312" y="233" fill="#9aa4b2" text-anchor="middle">128 clicks</text>
      <text x="16" y="262" fill="#6366f1" font-family="monospace">/g8Qb</text><text x="70" y="262" fill="#c9d1d9">→ blog.dev/post-3</text><rect x="280" y="250" width="64" height="18" rx="9" fill="#21262d"/><text x="312" y="263" fill="#9aa4b2" text-anchor="middle">74 clicks</text>
      <text x="16" y="292" fill="#6366f1" font-family="monospace">/g8Qc</text><text x="70" y="292" fill="#c9d1d9">→ shop.io/sale</text><rect x="280" y="280" width="64" height="18" rx="9" fill="#21262d"/><text x="312" y="293" fill="#9aa4b2" text-anchor="middle">203 clicks</text>
    </g>
    <!-- chart -->
    <rect x="376" y="176" width="360" height="290" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="392" y="202" font-size="14" font-weight="700" fill="#e6edf3">Clicks over time · /g8Qc</text>
    <g fill="#6366f1">
      <rect x="402" y="380" width="34" height="60"/><rect x="446" y="350" width="34" height="90"/>
      <rect x="490" y="300" width="34" height="140"/><rect x="534" y="330" width="34" height="110"/>
      <rect x="578" y="270" width="34" height="170"/><rect x="622" y="310" width="34" height="130"/>
      <rect x="666" y="360" width="34" height="80"/>
    </g>
    <line x1="392" y1="440" x2="720" y2="440" stroke="#30363d"/>
  </g>
  <text x="40" y="492" font-size="12" fill="#3fb950" font-family="SFMono-Regular,monospace">FastAPI · SQLite · base62 codes · Chart.js · ✓ 7 tests (shorten / redirect / click-count / listing)</text>
</svg>
