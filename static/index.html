<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Shortly · URL shortener</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{--bg:#0f1117;--card:#161b22;--accent:#6366f1;--fg:#e6edf3;--muted:#9aa4b2}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px}
  h1{margin:0 0 4px} .sub{color:var(--muted);margin-bottom:24px}
  form{display:flex;gap:10px} input{flex:1;padding:12px;border-radius:9px;border:1px solid #30363d;background:#0b0d12;color:var(--fg)}
  button{background:var(--accent);border:0;color:#fff;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:600}
  .card{background:var(--card);border:1px solid #30363d;border-radius:12px;padding:18px;margin-top:20px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #21262d}
  .code{color:var(--accent);font-family:monospace} a{color:#58a6ff}
  .pill{background:#21262d;border-radius:20px;padding:3px 10px;font-size:.85rem;color:var(--muted)}
</style></head>
<body><div class="wrap">
  <h1>Shortly</h1><div class="sub">Shorten a URL and track every click.</div>
  <form id="f"><input id="url" placeholder="https://example.com/very/long/link" required>
    <button>Shorten</button></form>
  <div id="result"></div>
  <div class="card"><h3 style="margin-top:0">Your links</h3><div id="links"></div></div>
  <div class="card"><h3 style="margin-top:0">Clicks over time</h3><canvas id="chart" height="120"></canvas></div>
  <script>
    const api = (p,o)=>fetch(p,o).then(r=>r.json());
    let chart;
    async function refresh(){
      const links = await api('/api/links');
      document.getElementById('links').innerHTML = links.length? links.map(l=>`
        <div class="row"><span><a class="code" href="/${l.code}">/${l.code}</a> → ${l.target}</span>
        <span class="pill" data-code="${l.code}" style="cursor:pointer">${l.clicks} clicks</span></div>`).join('')
        : '<div class="sub">No links yet — shorten one above.</div>';
      document.querySelectorAll('[data-code]').forEach(el=>el.onclick=()=>showStats(el.dataset.code));
      if(links[0]) showStats(links[0].code);
    }
    async function showStats(code){
      const s = await api('/api/stats/'+code);
      const labels = s.by_day.map(d=>d.date), data = s.by_day.map(d=>d.clicks);
      if(chart) chart.destroy();
      chart = new Chart(document.getElementById('chart'),{type:'bar',
        data:{labels,datasets:[{label:'/'+code,data,backgroundColor:'#6366f1'}]},
        options:{plugins:{legend:{labels:{color:'#9aa4b2'}}},scales:{x:{ticks:{color:'#9aa4b2'}},y:{ticks:{color:'#9aa4b2'}}}}});
    }
    document.getElementById('f').onsubmit=async e=>{
      e.preventDefault();
      const url=document.getElementById('url').value;
      const r=await api('/api/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
      document.getElementById('result').innerHTML=`<div class="card">Short link: <a class="code" href="${r.short_url}">${r.short_url}</a></div>`;
      document.getElementById('url').value=''; refresh();
    };
    refresh();
  </script>
</div></body></html>
